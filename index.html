*{box-sizing:border-box}body{margin:0;background:#f8f6ef;color:#15352f;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}.entry{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:440px;background:#fffdf8;border:1px solid #dedfd3;border-radius:25px;padding:35px;box-shadow:0 20px 70px #234d400b}.brand{font:700 24px Georgia,serif;letter-spacing:-1px}.brand span{color:#a46d3b}.badge{display:inline-block;margin:35px 0 15px;font-size:11px;letter-spacing:2px;font-weight:bold;color:#86672d}.symbols{float:right;font-size:32px;margin-top:25px}h1{font-size:34px;letter-spacing:-1.5px;margin:4px 0 15px;line-height:1.3}p{font-size:14px;line-height:1.9;color:#62706a}label{display:block;font-size:13px;font-weight:bold;margin:26px 0 9px}input,button{font:inherit;min-height:48px;border-radius:10px}input{width:100%;padding:13px;border:1px solid #a4b29d;font-size:16px;background:#fff}button{cursor:pointer}button[type=submit]{width:100%;background:#234d40;color:white;padding:13px;border:0;font-weight:bold;margin-top:15px}.reveal{border:0;background:transparent;color:#62706a;padding:10px 0;font-size:12px}.foot{font-size:11px;border-top:1px solid #dedfd3;margin-top:20px;padding-top:16px}#error{font-size:13px;line-height:1.8;color:#a14524;margin:10px 0;min-height:24px}button:disabled{opacity:.5}input:focus-visible,button:focus-visible{outline:3px solid #c4863e;outline-offset:3px}iframe{position:fixed;inset:0;border:0;width:100%;height:100%;background:#f8f6ef}[hidden]{display:none!important}@media(max-width:400px){.entry{padding:16px}.card{padding:27px 24px}h1{font-size:31px}}
</style></head><body><div class="entry" id="entry"><section class="card"><div class="brand">HERO <span>English Lab.</span></div><span class="symbols" aria-hidden="true">✦</span><span class="badge">YOUR NEXT ADVENTURE</span><h1>작은 문장으로,<br>커다란 모험을.</h1><p>나만의 영어 미션이 기다리고 있어.<br>입장 코드를 입력하고 탐험을 시작해 봐.</p><form id="login"><label for="passcode">입장 코드</label><input id="passcode" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required aria-describedby="error"><button type="button" class="reveal" id="reveal" aria-pressed="false">코드 보기</button><button type="submit" id="submit">학습실 열기 →</button><div id="error" role="status" aria-live="polite"></div></form><p class="foot">코드는 이 기기에 저장하지 않아. 학습실을 잠그면 다시 입력해야 해.</p><noscript>학습실을 열려면 JavaScript를 켜 주세요.</noscript></section></div><script>
const form=document.querySelector('#login'),input=document.querySelector('#passcode'),button=document.querySelector('#submit'),error=document.querySelector('#error');
document.querySelector('#reveal').onclick=function(){const show=input.type==='password';input.type=show?'text':'password';this.textContent=show?'코드 숨기기':'코드 보기';this.setAttribute('aria-pressed',String(show));};
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
form.onsubmit=async event=>{event.preventDefault();button.disabled=true;error.textContent='학습실을 여는 중…';let bundle;try{const response=await fetch('mission.enc.json',{cache:'no-store'});if(!response.ok)throw Error();bundle=await response.json();}catch{error.textContent='인터넷 연결을 확인하고 다시 시도해 주세요.';button.disabled=false;return;}try{if(!crypto.subtle)throw Error();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value.trim()),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(bundle.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(bundle.iv)},key,decode(bundle.ciphertext));const frame=document.createElement('iframe');frame.title='히어로 영어 미션 학습실';frame.setAttribute('sandbox','allow-scripts allow-same-origin');frame.srcdoc=new TextDecoder().decode(plain);document.body.append(frame);document.querySelector('#entry').hidden=true;input.value='';error.textContent='';frame.focus();}catch{error.textContent='입장 코드가 맞는지 확인해 줘. 대문자와 소문자도 구분해.';input.focus();}finally{button.disabled=false;}};
window.addEventListener('message',e=>{const frame=document.querySelector('iframe');if(e.origin!==location.origin||e.source!==frame?.contentWindow||e.data?.type!=='yeorip-lock')return;frame.remove();document.querySelector('#entry').hidden=false;input.focus();});
</script></body></html>
